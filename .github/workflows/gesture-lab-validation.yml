name: Gesture Lab validation

on:
  push:
    branches:
      - fix/gesture-engine-performance
  pull_request:
    paths:
      - 'gesture-lab/**'
      - '.github/workflows/gesture-lab-validation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gesture-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gesture-lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
